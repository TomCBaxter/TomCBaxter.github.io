- image: "assets/img/gallery/tongue-protruding.webp"
  title: "Boa Island figures"
  description: >
    Two stone carvings, resembling pagan gods at (later) ancient christian graveyard on Boa Island, County Fermanagh, Ireland. 
    The magic of the place is shown in the [video](https://www.youtube.com/watch?v=DSpoPBb8LAg) of Seamus Heaney reciting his poem ['January God'](https://www.carrowkeel.com/sites/misc/boa.html) while passing through the foggy graveyard hosting the figures.
   

- image: "assets/img/gallery/Custom_house.png"
  title: "Top: Liverpool Custom house (1954). Bottom: (Left) Custom house post WW2 blitz. (Right) Modern Liverpool ONE."
  description: "Originally built (c1839) on the site of the old dock and demolished in 1948 following damage from the Liverpool Blitz. Liverpool overhead railway infront, known colloquially as the 'Dockers Umbrella', also sadly demolished."  

