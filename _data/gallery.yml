- image: rochdale_town_hall.webp
  title: Detail of Rochdale Town Hall (c. 1871) interior
  caption: >
    There was a story I heard (it turned out to be a folktale) that Hitler liked this building so much that, if Operation Sea Lion had succeeded, it was to be moved brick by brick to Germany.

- image: gerrard_LacosteBeast.jpeg
  title: "Steven Gerrard's Lacoste beast (1998?)"
  caption: >
    Steven Gerrard visiting his old school, Cardinal Heenan in West Derby, Liverpool. The highlight of course is the Lacoste pullover and the skinheads in the back. A few more lovely pieces: [1](/assets/img/gallery/lacoste/1.webp), [2](/assets/img/gallery/lacoste/2.jpg), [3](/assets/img/gallery/lacoste/3.webp), [4](/assets/img/gallery/lacoste/4.webp).

