# The Cabinet of Curiosities, shown on /personal/ in this order.
#
# To add an item: put the image in assets/img/gallery/, then add a block:
#
# - image: my_photo.jpg
#   title: Short title
#   caption: >
#     Optional longer text. Markdown works, e.g. [a link](https://example.com).
#
# Lines starting with # are notes and never appear on the site.

- image: UKscheduledMonuments.jpeg
  title: UK scheduled monuments
  caption: >
    Historic England map of scheduled monuments in the UK. The lines near the England–Scotland border and further north are Hadrian's Wall (begun ~120 AD) and the Antonine Wall (begun ~142 AD) respectively. The sparse spot in East Anglia roughly marks out "The Fens". Nowadays this is reclaimed land, due to draining, but historically it would have been marshland.

- image: skillSpecs_clawer.jpeg
  title: The claw
  caption: >
    OSRS creator skill specs has a unique (and painful) F-key grip.

- image: unknown_warrior.jpg
  title: The Unknown Warrior (1920)
  caption: >
    Coffin of an unidentified British soldier killed in WW1, at Westminster Abbey. Buried with soil from the various battlegrounds of the war. Symbolic of all (or just unidentified?) fallen soldiers in WW1.

- image: boosterRecovery.jpeg
  title: Booster recovery
  caption: >
    Starship Super Heavy booster being recovered.

- image: diminishingReturns.jpeg
  title: Diminishing returns
  caption: >
    The PS1-era Lara Croft 3D model has around 500 triangles, for reference.

- image: Toros_de_Guisando.jpg
  title: Toros de Guisando
  caption: >
    Iron Age (~200 BC) sculptures in the modern province of Ávila, west-central Spain.

- image: taq_kasra.jpg
  title: Tāq Kasrā (1950)
  caption: >
    Ruins of the only visible structure (~200–500 AD?) in the capital city of the Parthian and Sassanian empires, in modern-day Iraq.

- image: tongue-protruding.webp
  title: Boa Island figures
  caption: >
    Two stone carvings, resembling pagan gods, at a (later) ancient Christian graveyard on Boa Island, County Fermanagh, Ireland. The magic of the place is shown in the [video](https://www.youtube.com/watch?v=DSpoPBb8LAg) of Seamus Heaney reciting his poem ['January God'](https://www.carrowkeel.com/sites/misc/boa.html) while passing through the fog-filled graveyard hosting the figures.

- image: Custom_House.jpg
  title: Liverpool Custom House
  caption: >
    Top: the Custom House (1954). Bottom left: after the WW2 Blitz. Bottom right: modern Liverpool ONE. Originally built (c. 1839) on the site of the old dock and demolished in 1948 following damage from the Liverpool Blitz. The Liverpool Overhead Railway in front, known colloquially as the "Dockers' Umbrella", was also sadly demolished.

- image: rodney_pontins.jpeg
  title: Nicholas Lyndhurst (Rodney Trotter) in Pontins with his Mum (1976)
  caption: >
    I would imagine this is shortly after being forced to perform the 1970s equivalent of the cha-cha slide on an empty dancefloor by his mother.

